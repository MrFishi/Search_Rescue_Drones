[project]
name = "vision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MrFishi", email = "royrishi2015@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "lxml>=6.1.3",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "sahi>=0.12.6",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.70.0",
    "ultralytics>=8.4.138",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }